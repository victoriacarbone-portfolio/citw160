<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art Gallery - Image Optimization</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <h1>Art Gallery</h1>
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Gallery</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <section>
      <h2>Featured Artwork</h2>
      <p>This page demonstrates image optimization and accessibility using artwork images.</p>

      <!-- Compressed using Squoos -->
      <img src="images/paper_sketch_rabbit.jpg" alt="Detailed graphite sketch of a rabbit’s head drawn on a Christmas card" loading="lazy" width="600">

    </section>

    <section>
      <h2>Digital Illustration</h2>

      <!-- WEBP -->
      <img src="images/digital_art_owls.webp" alt="Digital illustration of two Eastern Screech Owls, gray and red morphs, perched on branches under a full moon with colorful crystals emerging from the ground" loading="lazy" width="600">
    </section>

    <section>
      <h2>Feedback</h2>
      <form>
        <label for="feedback">Your Feedback:</label><br>
        <textarea id="feedback" name="feedback" rows="4" cols="50"></textarea><br>
        <button type="submit">Submit</button>
      </form>
    </section>

    <!-- Used DevTools to inspect the images. Found that the original JPG image had a large file size, so it was compressed using Squoosh to improve loading speed. Also verified that both images include alt text for accessibility and scale properly using responsive CSS. -->

  </main>

  <footer>
	<p><em>Original artwork created by me</em></p>
    <p>&copy; 2026 Lansing Community College CITW160</p>
	<p><a href="../index.html">Return to HUB</a></p>
  </footer>

</body>
</html>
