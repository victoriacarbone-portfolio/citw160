<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Accessible Form</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <main>
    <div class="wrapper">
      <h1>Contact the Artist</h1>

      <form action="#" method="post">
        
        <fieldset>
          <legend>Contact Information</legend>

          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required>

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>
        </fieldset>

        <fieldset>
          <legend>Your Message</legend>

          <label for="comments">Comments:</label>
          <textarea id="comments" name="comments" rows="5" required></textarea>
        </fieldset>

        <button type="submit">Submit</button>

      </form>

    </div>
  </main>

  <footer>
    <p>&copy; Lansing Community College 2026 CITW160</p>
	<p>Return to the main accessibility page: <a href="../index.html">Back to Accessible Art Gallery</a></p>
    <p><a href="../../index.html">Return to HUB</a></p>
  </footer>

</body>
</html>
